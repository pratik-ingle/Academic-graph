services:
  neo4j:
    image: neo4j:5.26-community
    container_name: a-graph-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser: http://localhost:7474
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_PLUGINS: '["apoc"]'
      # keep transaction logs small: reloads otherwise leave GBs of logs behind
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    restart: unless-stopped
