<title>CS &amp; Robotics Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root {
  /* Layout: a framed map plate of the embedding space; control bar above; detail panel docked right (stacked under the map on phones) */
  --bg: #f4f5f1;
  --surface: #fbfbf8;
  --surface-2: #eceee8;
  --ink: #15181b;
  --ink-2: #4b5157;
  --muted: #61686e;
  --line: #d9dcd4;
  --grid: #e7e9e3;
  --focus: #1c5cab;
  --edge-rgb: 21, 24, 27;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --seq-lo: #b7d3f6; --seq-hi: #0d366b;
  --div-neg: #e34948; --div-mid: #c3c4bd; --div-pos: #2a78d6;
  --bar: #bcc0b8; --none: #cdd0c8;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --panel-w: 384px;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #181b1f; --surface-2: #20242a; --ink: #eceee8; --ink-2: #b6bbb4;
    --muted: #8a9096; --line: #2b3036; --grid: #1b1f23; --focus: #6da7ec; --edge-rgb: 236, 238, 232;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --seq-lo: #1c3a5e; --seq-hi: #b7d3f6;
    --div-neg: #e66767; --div-mid: #50524f; --div-pos: #3987e5; --bar: #4b525a; --none: #353a41;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #181b1f; --surface-2: #20242a; --ink: #eceee8; --ink-2: #b6bbb4;
  --muted: #8a9096; --line: #2b3036; --grid: #1b1f23; --focus: #6da7ec; --edge-rgb: 236, 238, 232;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --seq-lo: #1c3a5e; --seq-hi: #b7d3f6;
    --div-neg: #e66767; --div-mid: #50524f; --div-pos: #3987e5; --bar: #4b525a; --none: #353a41;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
a { color: var(--focus); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px;
  padding-block: 14px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- control bar ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: grid; gap: 1px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 600 23px/1.1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > span { font: 600 10.5px/1 var(--font-label); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 4px 9px; border-radius: 3px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg .key { width: 14px; height: 0; border-top: 1.5px solid currentColor; }
.seg .key.dash { border-top-style: dashed; }

.search { position: relative; width: min(300px, 100%); }
.search input {
  width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
  padding: 0 34px 0 32px; font-size: 13.5px;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 10px; top: 10px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 8px; top: 8px; font: 500 11px/16px var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.results {
  position: absolute; top: 38px; left: 0; right: 0; z-index: 20; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.results li { padding: 6px 8px; border-radius: 4px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.results li[aria-selected="true"], .results li:hover { background: var(--surface-2); }
.results .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results .in { grid-column: 2 / 4; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -3px; }
.results .ct { font: 12px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.results .empty { color: var(--muted); display: block; }

/* ---- main area ---- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); gap: 12px; min-height: 0; }
.stage { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--bg); min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
.zoom { position: absolute; left: 10px; bottom: 10px; display: grid; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; cursor: pointer; font: 500 16px/1 var(--font-ui); color: var(--ink-2); }
.zoom button.fit { font-size: 10.5px; font-family: var(--font-label); letter-spacing: .06em; text-transform: uppercase; }
.zoom button:hover { color: var(--ink); background: var(--surface-2); }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hint { position: absolute; right: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; max-width: 280px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px;
  box-shadow: 0 6px 18px rgba(0,0,0,.12); font-size: 12.5px;
}
.tip b { display: block; font: 600 14px/1.25 var(--font-display); }
.tip .m { color: var(--ink-2); }
.tip .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* table view */
.table-wrap { position: absolute; inset: 0; overflow: auto; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); z-index: 1; font: 600 10.5px/1.2 var(--font-label); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--focus); }
th[aria-sort] button { color: var(--ink); }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.nm { font-weight: 500; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
td.inst { color: var(--ink-2); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr[aria-selected="true"] { background: var(--surface-2); }

/* ---- panel ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; min-height: 0; min-width: 0; }
.pane { padding: 18px 18px 22px; display: grid; gap: 18px; }
.eyebrow { margin: 0 0 6px; font: 600 10.5px/1 var(--font-label); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.pane h2 { margin: 0; font: 600 25px/1.15 var(--font-display); text-wrap: balance; }
.pane p { margin: 0; color: var(--ink-2); line-height: 1.5; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-block: 1px solid var(--line); }
.figs div { padding: 9px 0 8px; display: grid; gap: 2px; }
.figs div + div { padding-left: 10px; border-left: 1px solid var(--line); }
.figs b { font: 500 16px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.figs span { font-size: 11px; color: var(--muted); line-height: 1.2; }

.areas { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.areas button {
  width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 5px; cursor: pointer;
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 9px; row-gap: 1px; align-items: baseline;
}
.areas button:hover { background: var(--surface-2); }
.areas button[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1.5px var(--surface); align-self: center; }
.areas .lb { font-weight: 500; min-width: 0; }
.areas .ct { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.areas .who { grid-column: 2 / 4; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ramp { display: grid; gap: 4px; }
.ramp .bar-g { height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--seq-lo), var(--seq-hi)); }
.ramp .ends { display: flex; justify-content: space-between; font: 11px var(--font-mono); color: var(--muted); }
.lines-key { display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.lines-key div { display: flex; align-items: center; gap: 8px; }
.lines-key i { width: 22px; border-top: 1.5px solid var(--ink-2); }
.lines-key i.dash { border-top: 1.5px dashed var(--ink-2); }
details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 500; }
details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 6px; font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); }

/* detail */
.back { justify-self: start; border: 0; background: none; padding: 2px 0; color: var(--ink-2); cursor: pointer; font-size: 12.5px; }
.back:hover { color: var(--ink); }
.who-h { display: grid; gap: 4px; }
.who-h .inst { color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 4px 0 0; font-size: 12.5px; }
.kv dt { font: 600 10px/18px var(--font-label); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.kv dd { margin: 0; color: var(--ink-2); display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.kv dd .sw { transform: translateY(1px); flex: none; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.sect { display: grid; gap: 8px; }
.sect h3 { margin: 0; font: 600 10.5px/1 var(--font-label); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.sect h3 em { font: 500 11px var(--font-mono); letter-spacing: 0; text-transform: none; font-style: normal; }
.spark { display: grid; gap: 2px; }
.spark svg { width: 100%; height: 74px; display: block; overflow: visible; }
.spark .read { font: 11.5px var(--font-mono); color: var(--ink-2); min-height: 16px; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--focus); border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--ink-2); }
.papers { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.papers a { color: var(--ink); text-decoration: none; font-weight: 500; line-height: 1.35; }
.papers a:hover { text-decoration: underline; color: var(--focus); }
.papers .m { display: block; font: 11.5px var(--font-mono); color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
.people { margin: 0; padding: 0; list-style: none; display: grid; }
.people button {
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 5px 6px; border-radius: 4px;
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 9px; align-items: center;
}
.people button:hover { background: var(--surface-2); }
.people .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.people .in { grid-column: 2; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.people .v { grid-row: 1 / 3; grid-column: 3; font: 12px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.people .v i { display: block; height: 3px; margin-top: 3px; background: var(--focus); border-radius: 2px; opacity: .7; margin-left: auto; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; color: var(--ink); }
.links a:hover { background: var(--surface-2); }
.more { border: 0; background: none; color: var(--focus); cursor: pointer; padding: 2px 6px; justify-self: start; font-size: 12.5px; }

/* findings */
.fnav { display: flex; align-items: center; gap: 8px; }
.fnav > button, .fdots button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; cursor: pointer; color: var(--ink-2); font: 500 12.5px/1 var(--font-mono); height: 28px; min-width: 28px; }
.fnav > button:hover:not(:disabled), .fdots button:hover { background: var(--surface-2); color: var(--ink); }
.fnav > button:disabled { opacity: .4; cursor: default; }
.fdots { display: flex; gap: 4px; flex: 1; justify-content: center; }
.fdots button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pane p.lead { color: var(--ink); font-size: 14.5px; line-height: 1.55; }
.pane p.lead b { font-weight: 600; }
.pane p.note { font-size: 12px; color: var(--muted); }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .cl { font: 12px var(--font-ui); fill: var(--ink-2); }
.chart .cv { font: 500 11px var(--font-mono); fill: var(--ink); }
.chart .ax { font: 10.5px var(--font-mono); fill: var(--muted); }
.chart .hit { fill: transparent; }
.chart .bar { fill: var(--bar); }
.chart .bar.hl { fill: var(--focus); }
.chart .row:hover .cl { fill: var(--ink); }
.chart .row:hover .bar:not(.hl) { fill: var(--ink-2); }
.chart .dl { stroke: var(--bar); stroke-width: 2; }
.chart .da { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.5; }
.chart .db { fill: var(--focus); stroke: var(--surface); stroke-width: 1.5; }
.chart .refl { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .basel { stroke: var(--line); }
.chart .area { fill: var(--focus); opacity: .14; }
.chart .ln { fill: none; stroke: var(--focus); stroke-width: 2; stroke-linejoin: round; }
.chart .pt { fill: var(--focus); stroke: var(--surface); stroke-width: 1.5; }
.lgd { display: flex; gap: 6px 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.lgd span { display: inline-flex; align-items: center; gap: 6px; }
.lgd i { display: inline-block; flex: none; }
.lgd i.o { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); background: var(--surface); }
.lgd i.f, .lgd i.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--focus); }
.lgd i.dash { width: 20px; border-top: 1.6px dashed var(--ink); }
.ramp .bar-d { height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--div-neg), var(--div-mid), var(--div-pos)); }
.tog { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink); }
.tog:hover { background: var(--surface-2); }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cta { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.cta b { font: 600 15px/1.25 var(--font-display); }
.cta span { font-size: 12.5px; color: var(--ink-2); }
.cta:hover { border-color: var(--ink-2); }
.cohorts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cohorts button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 6px 9px; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--ink); }
.cohorts button:hover { background: var(--surface-2); }
.cohorts button[aria-pressed="true"] { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
.cohorts .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cohorts .c { font: 11.5px var(--font-mono); color: var(--muted); }
.twins { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.twins li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.twins button { border: 0; background: none; padding: 4px 0; cursor: pointer; font-weight: 500; text-align: left; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.twins button:hover { color: var(--focus); text-decoration: underline; }
.twins span { color: var(--muted); }
.twins .v { font: 12px var(--font-mono); color: var(--ink-2); }
.method summary { font-size: 12.5px; color: var(--ink-2); }
.method p { margin-top: 8px; font-size: 12.5px; }
.ctip { position: fixed; z-index: 30; pointer-events: none; max-width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.12); color: var(--ink); }

/* beyond CS & methods (full-stage documents) */
.doc-wrap { position: absolute; inset: 0; overflow: auto; background: var(--surface); }
.doc { max-width: 980px; margin: 0 auto; padding: 22px 24px 44px; display: grid; gap: 30px; }
.doc header { display: grid; gap: 6px; }
.doc h2 { margin: 0; font: 600 27px/1.15 var(--font-display); text-wrap: balance; }
.doc h3 { margin: 0; font: 600 17px/1.25 var(--font-display); }
.doc p { margin: 0; color: var(--ink-2); max-width: 74ch; line-height: 1.55; }
.doc p.sub { color: var(--muted); font-size: 12.5px; }
.doc section { display: grid; gap: 10px; min-width: 0; }
.doc .chart-x { overflow-x: auto; }
.doc .chart-x > svg { min-width: 560px; max-width: 760px; }
.doc table { font-size: 12.5px; }
.doc tbody tr { cursor: default; }
.doc .mtable th, .doc .mtable td { white-space: normal; vertical-align: top; line-height: 1.45; }
.doc .mtable td:first-child { font-weight: 600; min-width: 150px; }
.doc .mtable td:last-child { color: var(--muted); min-width: 120px; }
.smalls { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px 20px; }
.smalls figure { margin: 0; min-width: 0; }
.smalls svg { width: 100%; height: auto; display: block; overflow: visible; }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px 26px; }
.ex-grid h4 { margin: 0 0 6px; font: 600 10.5px/1.2 var(--font-label); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  if (v === "findings") { if (opts.finding != null) st.finding = opts.finding; setFinding(st.finding); }
  else {
    // the map, the 3D view and the table share a selection; the other views start fresh
    if (was !== "map" && was !== "3d" && was !== "table") {
      st.sel = -1; st.area = -1; clearHash();
      if (v === "3d") { touched3 = false; Object.assign(cam3, home3()); }
    }
    try {
      if (st.sel < 0 && v === "3d") history.replaceState(null, "", "#3d");
      else if (st.sel < 0 && was === "3d") clearHash();
    } catch (_) {}
    renderPanel();
    if (st.sel >= 0 && (v === "3d" || was === "3d")) focusSel(false); // the other layout puts them somewhere else
    else draw();
    if (v === "3d") setSpin(spinOn);
  }
}
$("#v-map").onclick = () => setView("map");
$("#v-3d").onclick = () => setView("3d");
if (!HAS3D) $("#v-3d").hidden = true;
$("#v-find").onclick = () => setView("findings");
$("#v-beyond").onclick = () => setView("beyond");
$("#v-methods").onclick = () => setView("methods");
if (!BX) $("#v-beyond").hidden = true;
$("#v-table").onclick = () => setView("table");
if (!F) $("#v-find").hidden = true;

// ---------- search ----------
const q = $("#q"), list = $("#results"), box = $("#search-box");
let hits = [], cur = -1;
function closeResults() { list.hidden = true; q.setAttribute("aria-expanded", "false"); cur = -1; }
function renderResults() {
  list.innerHTML = hits.length ? hits.map((i, k) => {
    const r = R[i];
    return `<li role="option" id="opt-${k}" data-k="${k}" aria-selected="${k === cur}"><span class="sw" style="background:${areaColor(r.a)}"></span>
      <span class="nm">${esc(r.name)}</span><span class="ct">${fmt(r.cites)}</span><span class="in">${esc(r.inst || "")}</span></li>`;
  }).join("") : `<li class="empty">No researcher or institution matches “${esc(q.value)}”.</li>`;
  list.hidden = false; q.setAttribute("aria-expanded", "true");
  if (cur >= 0) q.setAttribute("aria-activedescendant", "opt-" + cur); else q.removeAttribute("aria-activedescendant");
}
q.addEventListener("input", () => {
  if (st.view === "table") { renderTable(); return; }
  const v = fold(q.value.trim());
  if (!v) { closeResults(); return; }
  hits = byCites.filter((i) => hay[i].includes(v))
    .sort((a, b) => (fold(R[b].name).startsWith(v) - fold(R[a].name).startsWith(v)) || (R[b].cites - R[a].cites)).slice(0, 8);
  cur = hits.length ? 0 : -1; renderResults();
});
q.addEventListener("keydown", (e) => {
  if (e.key === "Escape") e.stopPropagation(); // Esc closes the search, never the selection
  if (list.hidden) { if (e.key === "Escape") q.blur(); return; }
  if (e.key === "ArrowDown") { cur = Math.min(hits.length - 1, cur + 1); renderResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { cur = Math.max(0, cur - 1); renderResults(); e.preventDefault(); }
  else if (e.key === "Enter" && cur >= 0) { pick(hits[cur]); e.preventDefault(); }
  else if (e.key === "Escape") closeResults();
});
list.addEventListener("pointerdown", (e) => { const li = e.target.closest("[data-k]"); if (li) { e.preventDefault(); pick(hits[+li.dataset.k]); } });
q.addEventListener("blur", () => setTimeout(closeResults, 120));
function pick(i) {
  closeResults(); q.value = ""; q.blur(); st.area = -1;
  if (st.view in DOC_VIEWS) setView("map"); // a researcher is shown on the map, not over a document
  select(i);
}
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); }
  else if (e.key === "Escape" && !typing && st.sel >= 0) select(-1, { fly: false });
  else if (in3d() && !typing && /^Arrow(Left|Right|Up|Down)$/.test(e.key) && (document.activeElement === document.body || document.activeElement === cv)) {
    e.preventDefault(); if (spinOn) setSpin(false); touched3 = true; // arrow keys turn the 3D view
    if (e.key === "ArrowLeft") cam3.yaw += 0.12; else if (e.key === "ArrowRight") cam3.yaw -= 0.12;
    else cam3.pitch = clampPitch(cam3.pitch + (e.key === "ArrowUp" ? -0.1 : 0.1));
    draw();
  }
});

// ---------- boot ----------
readTokens();
const reTheme = () => { readTokens(); renderPanel(); draw(); if (st.view === "table") renderTable(); };
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reTheme);
new ResizeObserver(() => { if (st.view === "map" || st.view === "findings" || st.view === "3d") resize(); }).observe($("#stage"));
renderPanel();
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
const fromHash = () => {
  const id = location.hash.slice(1), fm = /^finding-(\d)$/.exec(id);
  if (id === "beyond-cs" && BX) { if (st.view !== "beyond") setView("beyond"); return; }
  if (id === "methods") { if (st.view !== "methods") setView("methods"); return; }
  if (id === "3d" && HAS3D) { if (st.view !== "3d") setView("3d"); return; }
  if (fm && F) { const k = Math.min(FTITLES.length, Math.max(1, +fm[1])) - 1; if (st.view !== "findings") setView("findings", { finding: k }); else if (k !== st.finding) setFinding(k); return; }
  const i = R.findIndex((r) => r.id === id);
  if (i >= 0 && i !== st.sel) { if (st.view in DOC_VIEWS) setView("map"); select(i); }
};
window.addEventListener("hashchange", fromHash);
fromHash();
$("#subtitle").textContent = `The ${fmt(N)} most-cited researchers in computer science and robotics, placed by what they publish`;
})();
</script>
